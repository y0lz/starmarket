<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои товары — StarMarket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --primary: #0088cc;
            --accent: #ff9d00;
            --text: #e6edf3;
            --border: #30363d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .header h1 {
            font-size: 24px;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .stats-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
        }

        .product-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-meta {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-delete {
            background: #ff4444;
            color: white;
        }

        .product-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .status-active {
            background: rgba(0, 170, 0, 0.2);
            color: #00ff00;
        }

        .status-inactive {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .error-msg {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .success-msg {
            background: #00aa00;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">← Назад</button>
            <h1>📦 Мои товары</h1>
        </div>
        <button class="add-btn" onclick="addProduct()">+ Добавить</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <div class="stats-card" id="statsCard">
        <div class="stat-item">
            <div class="stat-value" id="activeCount">0</div>
            <div class="stat-label">Активных</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="totalSales">0</div>
            <div class="stat-label">Продаж</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="slotsLeft">0</div>
            <div class="stat-label">Слотов</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-filter="active">Активные</div>
        <div class="tab" data-filter="all">Все товары</div>
        <div class="tab" data-filter="inactive">Неактивные</div>
    </div>

    <div id="productsList">
        <div class="loading">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => goBack());

        const userId = tg.initDataUnsafe?.user?.id || 123456;
        const API_URL = window.location.origin;

        let allProducts = [];
        let currentFilter = 'active';
        let userProfile = null;

        function goBack() {
            window.location.href = '/';
        }

        function addProduct() {
            window.location.href = '/add-product.html';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Переключение табов
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderProducts();
            });
        });

        // Загрузка профиля
        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile?userId=${userId}`);
                const data = await response.json();

                if (response.ok && data.user) {
                    userProfile = data.user;
                    document.getElementById('activeCount').textContent = data.user.active_products_count;
                    document.getElementById('totalSales').textContent = data.user.total_sales;
                    document.getElementById('slotsLeft').textContent = 
                        `${data.user.max_products - data.user.active_products_count}/${data.user.max_products}`;
                }
            } catch (e) {
                console.error('Load profile error:', e);
            }
        }

        // Загрузка товаров
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/seller?userId=${userId}`);
                const data = await response.json();

                if (response.ok && data.products) {
                    allProducts = data.products;
                    renderProducts();
                } else {
                    showError('Ошибка загрузки товаров');
                }
            } catch (e) {
                console.error('Load products error:', e);
                showError('Ошибка загрузки товаров');
            }
        }

        // Отображение товаров
        function renderProducts() {
            const container = document.getElementById('productsList');
            
            let filtered = allProducts;
            if (currentFilter === 'active') {
                filtered = allProducts.filter(p => p.is_active);
            } else if (currentFilter === 'inactive') {
                filtered = allProducts.filter(p => !p.is_active);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div class="empty-title">Нет товаров</div>
                        <div>${currentFilter === 'active' ? 'Добавьте свой первый товар' : 'Здесь пока пусто'}</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <img src="${product.image}" class="product-image" alt="${product.title}">
                    <div class="product-info">
                        <div class="product-title">
                            ${product.title}
                            <span class="product-status ${product.is_active ? 'status-active' : 'status-inactive'}">
                                ${product.is_active ? 'Активен' : 'Неактивен'}
                            </span>
                        </div>
                        <div class="product-meta">
                            ${product.game} • ${product.category}
                            ${product.type === 'multi' ? ` • В наличии: ${product.stock}` : ''}
                        </div>
                        <div class="product-price">⭐ ${product.price_stars}</div>
                        <div class="product-meta">Продано: ${product.sales_count || 0}</div>
                        <div class="product-actions">
                            <button class="btn-edit" onclick="editProduct(${product.id})">✏️ Редактировать</button>
                            ${product.is_active 
                                ? `<button class="btn-delete" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>`
                                : `<button class="btn-edit" onclick="activateProduct(${product.id})">✅ Активировать</button>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Редактирование товара
        function editProduct(productId) {
            // TODO: Создать страницу редактирования
            showError('Функция редактирования в разработке');
        }

        // Активация товара
        async function activateProduct(productId) {
            if (!userProfile) return;

            if (!userProfile.can_add_product) {
                showError('Достигнут лимит активных товаров');
                return;
            }

            if (!confirm('Активировать этот товар?')) return;

            try {
                const response = await fetch(`${API_URL}/api/seller`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        productId,
                        userId,
                        is_active: true
                    })
                });

                if (response.ok) {
                    showSuccess('✅ Товар активирован');
                    await loadProfile();
                    await loadProducts();
                } else {
                    showError('Ошибка активации товара');
                }
            } catch (e) {
                console.error('Activate error:', e);
                showError('Ошибка активации товара');
            }
        }

        // Удаление товара
        async function deleteProduct(productId) {
            if (!confirm('Удалить этот товар? Это действие нельзя отменить.')) return;

            try {
                const response = await fetch(`${API_URL}/api/seller`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, userId })
                });

                if (response.ok) {
                    showSuccess('✅ Товар удален');
                    await loadProfile();
                    await loadProducts();
                } else {
                    showError('Ошибка удаления товара');
                }
            } catch (e) {
                console.error('Delete error:', e);
                showError('Ошибка удаления товара');
            }
        }

        // Инициализация
        async function init() {
            await loadProfile();
            await loadProducts();
        }

        init();
    </script>
</body>
</html>
