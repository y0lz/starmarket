<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarMarket — P2P Маркетплейс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="loading" class="loading">
        ⏳ Загрузка StarMarket...
    </div>

    <div id="app" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <h1>⭐ StarMarket</h1>
                <div id="userInfo" class="user-btn" onclick="goToProfile()">
                    <div id="userAvatar" class="user-btn-avatar"></div>
                    <div id="userName" class="user-btn-text"></div>
                </div>
            </div>
            
            <input type="text" class="search-bar" placeholder="🔍 Поиск товаров..." id="searchInput">
        </div>

        <!-- Carousel Banners -->
        <div id="carouselSection" class="carousel-container">
            <div class="carousel-wrapper" id="carouselWrapper">
                <!-- Slides will be inserted here -->
            </div>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <!-- Games Catalog View -->
        <div id="gamesView">
            <div class="section-title">🎮 Выберите игру</div>
            <div class="games-grid" id="gamesGrid"></div>
        </div>

        <!-- Game Detail View (hidden by default) -->
        <div id="gameDetailView" style="display: none;">
            <div class="game-detail-header">
                <div class="game-detail-back" onclick="backToGames()">
                    ← Назад к играм
                </div>
                <div class="game-detail-info">
                    <div class="game-detail-icon" id="gameDetailIcon"></div>
                    <div class="game-detail-text">
                        <h2 id="gameDetailName"></h2>
                        <p id="gameDetailCount"></p>
                    </div>
                </div>
            </div>

            <!-- Categories for selected game -->
            <div class="section-title">Категории</div>
            <div class="categories" id="gameCategories"></div>

            <!-- Sort options -->
            <div class="sort-bar" id="sortBar">
                <div class="sort-btn active" data-sort="default">По умолчанию</div>
                <div class="sort-btn" data-sort="price-asc">Цена ↑</div>
                <div class="sort-btn" data-sort="price-desc">Цена ↓</div>
                <div class="sort-btn" data-sort="name">По названию</div>
            </div>

            <!-- Products Grid -->
            <div class="grid" id="productGrid"></div>
            
            <div class="empty" id="emptyState" style="display: none;">
                <div class="empty-icon">🔍</div>
                <div>Товары не найдены</div>
            </div>
        </div>
    </div>

    <div id="errorBlock" style="display: none;" class="loading">
        <h2>⚠️ Ошибка авторизации</h2>
        <p>Пожалуйста, откройте приложение через Telegram.</p>
        <p style="font-size: 12px; color: #666;" id="errorDetails"></p>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <img class="modal-img" id="modalImg" src="" alt="">
            <div class="modal-body">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="close-btn" id="closeModal">&times;</div>
                </div>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-desc" id="modalDesc"></div>
                <div class="modal-price" id="modalPrice"></div>
                <button class="buy-btn" id="buyBtn">💫 Купить через Telegram Stars</button>
            </div>
        </div>
    </div>

    <script>
        // Роутинг
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        
        if (page === 'profile') {
            window.location.href = '/profile.html';
        } else if (page === 'add-product') {
            window.location.href = '/add-product.html';
        } else if (page === 'my-products') {
            window.location.href = '/my-products.html';
        }

        let currentUser = null;
        let currentProduct = null;
        let allProducts = [];
        let currentGame = null;
        let state = {
            selectedCategory: null,
            searchQuery: '',
            sortBy: 'default'
        };

        // Carousel data
        const banners = [
            {
                title: '🎉 Добро пожаловать в StarMarket',
                subtitle: 'P2P маркетплейс игровых товаров',
                gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
            },
            {
                title: '⭐ Оплата через Telegram Stars',
                subtitle: 'Быстро, безопасно, удобно',
                gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'
            },
            {
                title: '🎮 Товары для всех игр',
                subtitle: 'Валюта, аккаунты, предметы и многое другое',
                gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'
            }
        ];

        // Games and categories from backend
        let games = [];
        let categories = [];

        // Mock products with detailed info
        const mockProducts = [
            {
                id: 1,
                title: "Золото 1000 шт",
                description: "Игровое золото для быстрого старта. Доставка моментальная после оплаты. Передача через внутриигровую почту.",
                price_stars: 150,
                game: "World of Warcraft",
                category: "Валюта",
                subcategory: "Золото",
                image: "https://via.placeholder.com/300x200/FFD700/000000?text=Gold",
                type: "multi",
                stock: 50
            },
            {
                id: 2,
                title: "Легендарный меч",
                description: "Уникальный меч с уроном 500-750. Редкий дроп из рейда. Только один экземпляр в наличии.",
                price_stars: 500,
                game: "World of Warcraft",
                category: "Предметы",
                subcategory: "Оружие",
                image: "https://via.placeholder.com/300x200/8B0000/FFD700?text=Sword",
                type: "single",
                stock: 1
            },
            {
                id: 3,
                title: "Аккаунт 80 lvl",
                description: "Прокачанный аккаунт с максимальным уровнем. Полный набор эпической экипировки. Все профессии прокачаны до максимума.",
                price_stars: 2000,
                game: "World of Warcraft",
                category: "Аккаунты",
                subcategory: "Прокачанные",
                image: "https://via.placeholder.com/300x200/4169E1/FFFFFF?text=Account",
                type: "single",
                stock: 1
            },
            {
                id: 4,
                title: "Кристаллы 5000 шт",
                description: "Премиум валюта для покупки эксклюзивных предметов. Моментальная доставка на аккаунт.",
                price_stars: 300,
                game: "Genshin Impact",
                category: "Валюта",
                subcategory: "Кристаллы",
                image: "https://via.placeholder.com/300x200/9370DB/FFFFFF?text=Crystals",
                type: "multi",
                stock: 100
            },
            {
                id: 5,
                title: "5★ персонаж",
                description: "Случайный 5-звездочный персонаж. Гарантированный дроп. Передача через привязку аккаунта.",
                price_stars: 1500,
                game: "Genshin Impact",
                category: "Персонажи",
                subcategory: "5 звезд",
                image: "https://via.placeholder.com/300x200/FF69B4/FFFFFF?text=5★+Hero",
                type: "single",
                stock: 3
            },
            {
                id: 6,
                title: "V-Bucks 13500",
                description: "Премиум валюта Fortnite. Подходит для покупки Battle Pass и скинов. Код активации.",
                price_stars: 800,
                game: "Fortnite",
                category: "Валюта",
                subcategory: "V-Bucks",
                image: "https://via.placeholder.com/300x200/7B68EE/FFFFFF?text=V-Bucks",
                type: "multi",
                stock: 30
            },
            {
                id: 7,
                title: "Редкий скин",
                description: "Эксклюзивный скин из старого Battle Pass. Больше не доступен в магазине. Уникальная возможность.",
                price_stars: 1200,
                game: "Fortnite",
                category: "Косметика",
                subcategory: "Скины",
                image: "https://via.placeholder.com/300x200/FF4500/FFFFFF?text=Rare+Skin",
                type: "single",
                stock: 1
            },
            {
                id: 8,
                title: "Робуксы 10000",
                description: "Игровая валюта Roblox. Можно потратить на игры, предметы и апгрейды. Доставка кодом.",
                price_stars: 600,
                game: "Roblox",
                category: "Валюта",
                subcategory: "Робуксы",
                image: "https://via.placeholder.com/300x200/E60012/FFFFFF?text=Robux",
                type: "multi",
                stock: 40
            }
        ];

        async function initApp() {
            const tg = window.Telegram?.WebApp;
            
            if (tg) {
                tg.ready();
                tg.expand();
                
                try {
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        currentUser = tg.initDataUnsafe.user;
                        showApp();
                        return;
                    }
                    
                    if (tg.initData) {
                        await validateTelegramData(tg.initData);
                        return;
                    }
                    
                    showError('Данные авторизации недоступны. Попробуйте перезайти через кнопку бота.');
                    
                } catch (e) {
                    console.error('Init error:', e);
                    showError('Ошибка инициализации: ' + e.message);
                }
                
            } else {
                showError('Приложение должно быть открыто через Telegram');
            }
        }

        async function validateTelegramData(initData) {
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: initData })
                });
                
                const data = await response.json();
                
                if (data.ok && data.user) {
                    currentUser = data.user;
                    showApp();
                } else {
                    const tg = Telegram.WebApp;
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        currentUser = tg.initDataUnsafe.user;
                        showApp();
                    } else {
                        showError('Ошибка авторизации: ' + (data.error || 'Неверная подпись'));
                    }
                }
            } catch (e) {
                console.error('Auth fetch error:', e);
                showError('Ошибка соединения с сервером');
            }
        }

        function showApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorBlock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
            if (currentUser) {
                const name = currentUser.first_name || currentUser.username || '?';
                document.getElementById('userName').textContent = 'Профиль';
                document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            }

            initCarousel();
            loadProducts();
            renderGames();
            initEventListeners();
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'none';
            document.getElementById('errorBlock').style.display = 'block';
            document.getElementById('errorDetails').textContent = msg;
        }

        function goToProfile() {
            window.location.href = 'https://mini-app-pi-ivory.vercel.app/profile.html';
        }

        async function loadProducts() {
            try {
                // Load games and categories from backend
                const gamesRes = await fetch('/api/games');
                const gamesData = await gamesRes.json();
                
                if (gamesData.ok) {
                    games = gamesData.games || [];
                    categories = gamesData.categories || [];
                    console.log('Loaded games from backend:', games);
                    console.log('Loaded categories from backend:', categories);
                }

                // Load products
                const res = await fetch('/api/products');
                const data = await res.json();
                allProducts = data.products || data;
            } catch (e) {
                console.log('Using mock products');
                allProducts = mockProducts;
            }

            renderGames();
        }

        // Carousel functions
        let currentSlide = 0;
        let carouselInterval;

        function initCarousel() {
            const wrapper = document.getElementById('carouselWrapper');
            const dots = document.getElementById('carouselDots');
            
            wrapper.innerHTML = banners.map((banner, index) => `
                <div class="carousel-slide" style="background: ${banner.gradient}">
                    <div class="carousel-content">
                        <div class="carousel-title">${banner.title}</div>
                        <div class="carousel-subtitle">${banner.subtitle}</div>
                    </div>
                </div>
            `).join('');

            dots.innerHTML = banners.map((_, index) => `
                <div class="carousel-dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>
            `).join('');

            startCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        function updateCarousel() {
            const wrapper = document.getElementById('carouselWrapper');
            const dots = document.querySelectorAll('.carousel-dot');
            
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % banners.length;
            updateCarousel();
        }

        function startCarousel() {
            carouselInterval = setInterval(nextSlide, 4000);
        }

        function stopCarousel() {
            clearInterval(carouselInterval);
        }

        // Games catalog functions
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            
            if (games.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎮</div><div>Нет доступных игр</div></div>';
                return;
            }

            // Filter games that have products
            const gamesWithProducts = games.filter(game => game.product_count > 0);

            if (gamesWithProducts.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎮</div><div>Нет доступных игр</div></div>';
                return;
            }

            grid.innerHTML = gamesWithProducts.map(game => {
                return `
                    <div class="game-card" onclick="selectGame(${game.id})">
                        <div class="game-card-icon">${game.icon}</div>
                        <div class="game-card-name">${game.name}</div>
                        <div class="game-card-count">${game.product_count} товаров</div>
                    </div>
                `;
            }).join('');
        }

        function selectGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            currentGame = game;
            
            // Hide games view, show game detail view
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('carouselSection').style.display = 'none';
            document.getElementById('gameDetailView').style.display = 'block';

            // Update game detail header
            document.getElementById('gameDetailIcon').innerHTML = game.icon;
            document.getElementById('gameDetailName').textContent = game.name;
            document.getElementById('gameDetailCount').textContent = `${game.product_count} товаров`;

            // Render categories for this game
            renderGameCategories(gameId);
            
            // Reset state and show all products for this game
            state.selectedCategory = null;
            state.sortBy = 'default';
            
            // Reset sort buttons
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sort === 'default');
            });
            
            filterProducts();
        }

        function backToGames() {
            currentGame = null;
            state.selectedCategory = null;
            
            document.getElementById('gamesView').style.display = 'block';
            document.getElementById('carouselSection').style.display = 'block';
            document.getElementById('gameDetailView').style.display = 'none';
        }

        function renderGameCategories(gameId) {
            const container = document.getElementById('gameCategories');
            const gameProducts = allProducts.filter(p => p.game_id === gameId);
            
            // Get unique categories for this game
            const categoriesInGame = new Set(gameProducts.map(p => p.category_id).filter(id => id));
            const availableCategories = categories.filter(cat => categoriesInGame.has(cat.id));

            if (availableCategories.length === 0) {
                container.innerHTML = '<div class="cat-chip active">Все</div>';
                return;
            }

            container.innerHTML = `
                <div class="cat-chip ${!state.selectedCategory ? 'active' : ''}" onclick="selectCategory(null)">
                    Все
                </div>
                ${availableCategories.map(cat => `
                    <div class="cat-chip ${state.selectedCategory === cat.id ? 'active' : ''}" 
                         onclick="selectCategory(${cat.id})">
                        ${cat.icon} ${cat.name}
                    </div>
                `).join('')}
            `;
        }

        function selectCategory(categoryId) {
            state.selectedCategory = categoryId;
            renderGameCategories(currentGame.id);
            filterProducts();
        }

        function filterProducts() {
            if (!currentGame) {
                return;
            }

            let filtered = allProducts.filter(p => p.game_id === currentGame.id);
            
            if (state.selectedCategory) {
                filtered = filtered.filter(p => p.category_id === state.selectedCategory);
            }
            
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(query) ||
                    p.description.toLowerCase().includes(query)
                );
            }
            
            switch (state.sortBy) {
                case 'price-asc':
                    filtered.sort((a, b) => a.price_stars - b.price_stars);
                    break;
                case 'price-desc':
                    filtered.sort((a, b) => b.price_stars - a.price_stars);
                    break;
                case 'name':
                    filtered.sort((a, b) => a.title.localeCompare(b.title));
                    break;
            }
            
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            const empty = document.getElementById('emptyState');
            
            if (products.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = products.map(p => {
                // Get game and category names from joined data
                const gameName = p.game?.name || p.game || 'Unknown';
                const categoryName = p.category?.name || p.category || 'Unknown';
                
                return `
                    <div class="card" data-id="${p.id}">
                        <img class="card-img" src="${p.image}" alt="${p.title}">
                        <div class="card-content">
                            <div class="card-game">${gameName}</div>
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">⭐ ${p.price_stars}</div>
                            <div class="card-type">${p.type === 'single' ? '📦 Штучный' : '🔢 Мульти'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showProductModal(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            currentProduct = product;
            
            // Get game and category names from joined data
            const gameName = product.game?.name || product.game || 'Unknown';
            const categoryName = product.category?.name || product.category || 'Unknown';
            
            document.getElementById('modalImg').src = product.image;
            document.getElementById('modalTitle').textContent = product.title;
            document.getElementById('modalMeta').innerHTML = `
                <span>🎮 ${gameName}</span>
                <span>📁 ${categoryName}</span>
                <span>${product.type === 'single' ? '📦 Штучный' : '🔢 Мульти'}</span>
            `;
            document.getElementById('modalDesc').textContent = product.description;
            document.getElementById('modalPrice').textContent = `⭐ ${product.price_stars}`;
            
            document.getElementById('modal').classList.add('show');
        }

        function initEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                if (currentGame) {
                    filterProducts();
                }
            });

            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.sortBy = e.target.dataset.sort;
                    if (currentGame) {
                        filterProducts();
                    }
                });
            });

            document.getElementById('productGrid').addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                if (!card) return;
                
                const productId = parseInt(card.dataset.id);
                showProductModal(productId);
            });

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('modal').classList.remove('show');
            });

            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    document.getElementById('modal').classList.remove('show');
                }
            });

            document.getElementById('buyBtn').addEventListener('click', async () => {
                if (!currentProduct || !currentUser) {
                    alert('Ошибка: пользователь не авторизован');
                    return;
                }

                try {
                    const response = await fetch('/api/create-invoice', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: currentProduct.title,
                            description: `Покупка: ${currentProduct.title}`,
                            amount: currentProduct.price_stars,
                            userId: currentUser.id
                        })
                    });

                    const data = await response.json();
                    
                    if (data.invoiceLink) {
                        if (window.Telegram && Telegram.WebApp) {
                            Telegram.WebApp.openInvoice(data.invoiceLink, (status) => {
                                if (status === 'paid') {
                                    alert('✅ Оплата прошла успешно!');
                                    document.getElementById('modal').classList.remove('show');
                                }
                            });
                        } else {
                            window.open(data.invoiceLink, '_blank');
                        }
                    } else {
                        alert('Ошибка создания платежа: ' + (data.error || 'Unknown error'));
                    }
                } catch (e) {
                    console.error('Payment error:', e);
                    alert('Ошибка при создании платежа');
                }
            });

            // Pause carousel on user interaction
            const carouselContainer = document.getElementById('carouselSection');
            carouselContainer.addEventListener('touchstart', stopCarousel);
            carouselContainer.addEventListener('touchend', () => {
                setTimeout(startCarousel, 3000);
            });
        }

        window.addEventListener('load', () => {
            setTimeout(initApp, 100);
        });
    </script>
</body>
</html>
