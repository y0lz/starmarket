<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет продавца — StarMarket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <div class="header">
        <div class="back-btn" onclick="goBack()">←</div>
        <h1>⭐ Кабинет продавца</h1>
    </div>

    <div id="loading" class="loading">⏳ Загрузка...</div>
    <div id="app" style="display: none;">

        <!-- Профиль карточка -->
        <div class="profile-section">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar" id="avatar"></div>
                    <div class="profile-info">
                        <h2 id="userName">—</h2>
                        <div class="nickname" id="userNickname">@не установлен</div>
                    </div>
                    <div class="badge badge-free" id="badgeStatus">🆓 Free</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="statProducts">0</div>
                        <div class="stat-label">Товаров</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statSales">0</div>
                        <div class="stat-label">Продаж</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statRating">—</div>
                        <div class="stat-label">Рейтинг</div>
                    </div>
                </div>

                <div id="ratingRow" class="rating" style="display:none; margin-top: 8px;">
                    <div class="rating-stars" id="ratingStars"></div>
                    <span id="ratingCount">(0 оценок)</span>
                </div>

                <div class="bio-text" id="bioText">Описание не заполнено</div>

                <button class="save-btn" onclick="toggleEdit()" style="margin-top: 16px; background: var(--card); border: 1px solid var(--border);">
                    ✏️ Редактировать профиль
                </button>
            </div>
        </div>

        <!-- Редактирование профиля -->
        <div id="editForm" class="edit-form" style="display: none;">
            <div class="form-group">
                <label class="form-label">Никнейм</label>
                <input type="text" class="form-input" id="inputNickname" placeholder="Ваш никнейм">
            </div>
            <div class="form-group">
                <label class="form-label">О себе</label>
                <input type="text" class="form-input" id="inputBio" placeholder="Расскажите о себе">
            </div>
            <button class="save-btn" onclick="saveProfile()">💾 Сохранить</button>
        </div>

        <!-- ========== ТРИ ТАБА ========== -->
        <div class="tab-bar">
            <div class="tab active" data-tab="overview" onclick="switchTab('overview')">👤 Обзор</div>
            <div class="tab" data-tab="products" onclick="switchTab('products')">📦 Товары</div>
            <div class="tab" data-tab="orders" onclick="switchTab('orders')">📊 Заказы</div>
        </div>

        <!-- ===== TAB: Обзор ===== -->
        <div id="tab-overview" class="tab-content active">
            <div class="overview-grid">
                <div class="overview-stat">
                    <div class="stat-value" id="ovProducts">0</div>
                    <div class="stat-label">Товаров</div>
                </div>
                <div class="overview-stat">
                    <div class="stat-value" id="ovSales">0</div>
                    <div class="stat-label">Продаж</div>
                </div>
                <div class="overview-stat">
                    <div class="stat-value" id="ovBalance">0 ⭐</div>
                    <div class="stat-label">Баланс</div>
                </div>
                <div class="overview-stat">
                    <div class="stat-value" id="ovRating">—</div>
                    <div class="stat-label">Рейтинг</div>
                </div>
            </div>

            <div class="section-title">Последние товары</div>
            <div id="overviewProducts"></div>
            <div id="overviewEmptyProducts" style="display:none;">
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <div>Нет товаров — <a href="#" onclick="goToAddProduct()" style="color:var(--primary)">добавьте первый</a></div>
                </div>
            </div>
        </div>

        <!-- ===== TAB: Товары ===== -->
        <div id="tab-products" class="tab-content">
            <div class="tab-bar" style="background: transparent; border-bottom: none; padding: 12px 16px; gap: 8px;">
                <div class="tab active" data-filter="active" onclick="switchProductFilter('active')" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px;">Активные</div>
                <div class="tab" data-filter="inactive" onclick="switchProductFilter('inactive')" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px;">Неактивные</div>
                <div class="tab" data-filter="all" onclick="switchProductFilter('all')" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px;">Все</div>
            </div>

            <button class="add-product-btn" onclick="goToAddProduct()">+ Добавить товар</button>
            <div id="productsListContainer"></div>
        </div>

        <!-- ===== TAB: Заказы ===== -->
        <div id="tab-orders" class="tab-content">
            <div id="ordersListContainer"></div>
        </div>

        <button class="action-btn" onclick="goBack()">🛍️ Открыть магазин</button>
    </div>

    <!-- Модалка редактирования товара -->
    <div id="editProductModal" class="modal-edit">
        <div class="modal-edit-content">
            <div class="modal-edit-title">
                <span>✏️ Редактирование</span>
                <span class="close-x" onclick="closeEditModal()">&times;</span>
            </div>
            <input type="hidden" id="editProductId">
            <div class="form-row">
                <label>Название</label>
                <input type="text" id="editTitle">
            </div>
            <div class="form-row">
                <label>Описание</label>
                <textarea id="editDescription" rows="3"></textarea>
            </div>
            <div class="form-row">
                <label>Цена (в Stars)</label>
                <input type="number" id="editPrice" min="1">
            </div>
            <div class="form-row">
                <label>Игра</label>
                <select id="editGame">
                    <option value="World of Warcraft">World of Warcraft</option>
                    <option value="Genshin Impact">Genshin Impact</option>
                    <option value="Fortnite">Fortnite</option>
                    <option value="Roblox">Roblox</option>
                    <option value="CS2">CS2</option>
                    <option value="Dota 2">Dota 2</option>
                    <option value="Valorant">Valorant</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div class="form-row">
                <label>Категория</label>
                <select id="editCategory">
                    <option value="Валюта">Валюта</option>
                    <option value="Предметы">Предметы</option>
                    <option value="Аккаунты">Аккаунты</option>
                    <option value="Персонажи">Персонажи</option>
                    <option value="Косметика">Косметика</option>
                    <option value="Услуги">Услуги</option>
                </select>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Активен</span>
                <div class="toggle-switch" id="editToggleActive" onclick="toggleEditActive()"></div>
            </div>
            <div class="btn-row">
                <button class="btn-save" onclick="saveProduct()">💾 Сохранить</button>
                <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
            </div>
            <div style="margin-top: 12px; text-align: center;">
                <button class="btn-delete-small" onclick="deleteProductFromModal()">🗑️ Удалить товар</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userProfile = null;
        let products = [];
        let orders = [];
        let currentTab = 'overview';
        let productFilter = 'active';

        const API_BASE = 'https://mini-app-pi-ivory.vercel.app';
        const BOT_TOKEN = '8325504889:AAHry7Yi4FNjgd0WG_ANcJeeZQpBmwFZhr8';

function verifyTelegramData(initDataUnsafe, botToken) {
    // Skip HMAC for now — openTelegramLink already ensures Telegram context
    return initDataUnsafe && initDataUnsafe.user ? true : false;
}
async function init() {
    const tg = window.Telegram?.WebApp;

    if (tg && tg.initDataUnsafe?.user) {
        currentUser = tg.initDataUnsafe.user;
    }

    if (!currentUser || !currentUser.id) {
        // Fallback: check if we're in Telegram context without initData
        if (!tg || !tg.initDataUnsafe?.user) {
            document.getElementById('loading').innerHTML = `
                <div style="text-align:center;padding:40px 20px;">
                    <div style="font-size:48px;margin-bottom:16px;">🔐</div>
                    <div style="color:#ff9d00;font-size:16px;margin-bottom:8px;">Откройте через Telegram</div>
                    <div style="color:#8b949e;font-size:13px;">Нажмите "Мой кабинет" в меню бота @PodiumTaskBot</div>
                </div>
            `;
            return;
        }
    }

    loadData();
}

async function loadData() {
    // Load profile
    try {
        const res = await fetch(`${API_BASE}/api/profile?userId=${currentUser.id}`);
        const data = await res.json();
        if (data.user) {
            userProfile = data.user;
        }
    } catch(e) { console.error('Profile load error:', e); }

    // Load products
    try {
        const res = await fetch(`${API_BASE}/api/seller?userId=${currentUser.id}`);
        const data = await res.json();
        if (data.products) products = data.products;
    } catch(e) { console.error('Products load error:', e); }

    // Load orders (mock for now)
    try {
        const res = await fetch(`${API_BASE}/api/profile?userId=${currentUser.id}`);
        if (res.ok) orders = [];
    } catch(e) {}

    renderUI();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-bar > .tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderCurrentTab();
}

function renderCurrentTab() {
    if (currentTab === 'overview') renderOverviewTab();
    else if (currentTab === 'products') renderProductsTab();
    else if (currentTab === 'orders') renderOrdersTab();
}

function renderOverviewTab() {
    // Stats
    document.getElementById('ovProducts').textContent = products.filter(p => p.is_active).length;
    document.getElementById('ovSales').textContent = userProfile?.total_sales || 0;
    document.getElementById('ovBalance').textContent = '0 ⭐';
    document.getElementById('ovRating').textContent = userProfile?.seller_rating || '—';

    // Recent products (max 3)
    const active = products.filter(p => p.is_active).slice(0, 3);
    const container = document.getElementById('overviewProducts');
    const emptyEl = document.getElementById('overviewEmptyProducts');

    if (active.length === 0) {
        container.innerHTML = '';
        emptyEl.style.display = 'block';
    } else {
        emptyEl.style.display = 'none';
        container.innerHTML = active.map(p => `
            <div class="product-card-list" onclick="openEditModal(${p.id})">
                <img class="p-img" src="${p.image || 'https://via.placeholder.com/52/0088cc/ffffff?text=📦'}" alt="">
                <div class="p-info">
                    <div class="p-title">${p.title}</div>
                    <div class="p-meta">${p.game} · Продано: ${p.sales_count || 0}</div>
                </div>
                <div class="p-right">
                    <div class="p-price">⭐ ${p.price_stars}</div>
                    <div class="p-status status-${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Активен' : 'Неактивен'}</div>
                </div>
            </div>
        `).join('');
    }
}

function switchProductFilter(filter) {
    productFilter = filter;
    document.querySelectorAll('#tab-products .tab').forEach(t => {
        const isActive = t.dataset.filter === filter;
        t.classList.toggle('active', isActive);
    });
    renderProductsTab();
}

function renderProductsTab() {
    const container = document.getElementById('productsListContainer');
    let filtered = products;
    if (productFilter === 'active') filtered = products.filter(p => p.is_active);
    else if (productFilter === 'inactive') filtered = products.filter(p => !p.is_active);

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <div>${productFilter === 'active' ? 'Нет активных товаров' : productFilter === 'inactive' ? 'Нет неактивных товаров' : 'Нет товаров'}</div>
                <div style="margin-top:8px;color:var(--primary);cursor:pointer;" onclick="goToAddProduct()">+ Добавить товар</div>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(p => `
        <div class="product-card-list" onclick="openEditModal(${p.id})">
            <img class="p-img" src="${p.image || 'https://via.placeholder.com/52/0088cc/ffffff?text=📦'}" alt="">
            <div class="p-info">
                <div class="p-title">${p.title}</div>
                <div class="p-meta">${p.game} · ${p.category}${p.type === 'multi' ? ` · В наличии: ${p.stock}` : ''}</div>
            </div>
            <div class="p-right">
                <div class="p-price">⭐ ${p.price_stars}</div>
                <div class="p-status status-${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Активен' : 'Неактивен'}</div>
            </div>
        </div>
    `).join('');
}

function renderOrdersTab() {
    const container = document.getElementById('ordersListContainer');
    if (orders.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div>Заказов пока нет</div>
            </div>
        `;
        return;
    }

    container.innerHTML = orders.map(o => `
        <div class="order-card">
            <div class="order-header">
                <div class="order-product">${o.product_title || 'Товар'}</div>
                <div class="order-status ${o.status}">${o.status_label || o.status}</div>
            </div>
            <div class="order-footer">
                <div class="order-amount">⭐ ${o.amount_stars}</div>
                <div class="order-date">${o.created_at ? new Date(o.created_at).toLocaleDateString('ru') : ''}</div>
            </div>
        </div>
    `).join('');
}

function renderUI() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    // Avatar
    const name = currentUser.first_name || currentUser.username || '?';
    document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();

    // Profile info
    document.getElementById('userName').textContent = name;
    document.getElementById('userNickname').textContent = '@' + (currentUser.username || 'не установлен');

    if (userProfile) {
        if (userProfile.nickname) {
            document.getElementById('userNickname').textContent = '@' + userProfile.nickname;
        }
        document.getElementById('statProducts').textContent = userProfile.active_products_count || 0;
        document.getElementById('statSales').textContent = userProfile.total_sales || 0;
        document.getElementById('statRating').textContent = userProfile.seller_rating || '—';
        document.getElementById('bioText').textContent = userProfile.bio || 'Описание не заполнено';

        if (userProfile.is_premium) {
            document.getElementById('badgeStatus').className = 'badge badge-premium';
            document.getElementById('badgeStatus').textContent = '⭐ Premium';
        }

        if (userProfile.seller_rating) {
            const stars = '★'.repeat(Math.round(userProfile.seller_rating));
            document.getElementById('ratingStars').textContent = stars;
            document.getElementById('ratingRow').style.display = 'flex';
        }
    }

    renderCurrentTab();
}

        function toggleEdit() {
    const form = document.getElementById('editForm');
    if (form.style.display === 'none') {
        form.style.display = 'block';
        if (userProfile) {
            document.getElementById('inputNickname').value = userProfile.nickname || '';
            document.getElementById('inputBio').value = userProfile.bio || '';
        }
    } else {
        form.style.display = 'none';
    }
}

async function saveProfile() {
    const nickname = document.getElementById('inputNickname').value.trim();
    const bio = document.getElementById('inputBio').value.trim();

    try {
        const res = await fetch(`${API_BASE}/api/profile`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUser.id,
                nickname: nickname,
                bio: bio
            })
        });
        const data = await res.json();
        if (data.success) {
            userProfile = { ...userProfile, nickname, bio };
            document.getElementById('editForm').style.display = 'none';
            renderUI();
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.showAlert('✅ Профиль сохранён!');
            }
        }
    } catch(e) {
        console.error('Save error:', e);
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.showAlert('❌ Ошибка сохранения');
        }
    }
}

function openEditModal(productId) {
    const p = products.find(pr => pr.id === productId);
    if (!p) return;
    document.getElementById('editProductId').value = productId;
    document.getElementById('editTitle').value = p.title || '';
    document.getElementById('editDescription').value = p.description || '';
    document.getElementById('editPrice').value = p.price_stars || '';
    document.getElementById('editGame').value = p.game || 'World of Warcraft';
    document.getElementById('editCategory').value = p.category || 'Валюта';
    const toggle = document.getElementById('editToggleActive');
    if (p.is_active) toggle.classList.add('on');
    else toggle.classList.remove('on');
    document.getElementById('editProductModal').classList.add('show');
}

function closeEditModal() {
    document.getElementById('editProductModal').classList.remove('show');
}

function toggleEditActive() {
    const toggle = document.getElementById('editToggleActive');
    toggle.classList.toggle('on');
}

async function saveProduct() {
    const productId = parseInt(document.getElementById('editProductId').value);
    const isActive = document.getElementById('editToggleActive').classList.contains('on');

    const updateData = {
        title: document.getElementById('editTitle').value.trim(),
        description: document.getElementById('editDescription').value.trim(),
        price_stars: parseInt(document.getElementById('editPrice').value),
        game: document.getElementById('editGame').value,
        category: document.getElementById('editCategory').value,
        is_active: isActive
    };

    try {
        const res = await fetch(`${API_BASE}/api/seller`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId, userId: currentUser.id, ...updateData })
        });
        const data = await res.json();
        if (data.success) {
            // Update local products array
            const idx = products.findIndex(p => p.id === productId);
            if (idx !== -1) products[idx] = { ...products[idx], ...updateData };
            closeEditModal();
            renderCurrentTab();
            if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('✅ Товар сохранён!');
        } else {
            if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('❌ ' + (data.error || 'Ошибка'));
        }
    } catch(e) {
        console.error('Save product error:', e);
        if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('❌ Ошибка сохранения');
    }
}

async function deleteProductFromModal() {
    const productId = parseInt(document.getElementById('editProductId').value);
    if (!confirm('Удалить этот товар?')) return;
    try {
        const res = await fetch(`${API_BASE}/api/seller`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId, userId: currentUser.id })
        });
        if (res.ok) {
            products = products.filter(p => p.id !== productId);
            closeEditModal();
            renderCurrentTab();
            if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('✅ Товар удалён');
        } else {
            if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('❌ Ошибка удаления');
        }
    } catch(e) {
        console.error('Delete product error:', e);
        if (window.Telegram?.WebApp) Telegram.WebApp.showAlert('❌ Ошибка удаления');
    }
}

function goToAddProduct() {
    const tg = window.Telegram?.WebApp;
    const url = 'https://mini-app-pi-ivory.vercel.app/add-product.html';
    if (tg) tg.openTelegramLink(url);
    else window.location.href = url;
}

function goBack() {
    window.location.href = 'https://mini-app-pi-ivory.vercel.app/';
}

window.addEventListener('load', init);
    </script>
</body>
</html>
