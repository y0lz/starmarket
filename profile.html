<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — StarMarket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --primary: #0088cc;
            --accent: #ff9d00;
            --text: #e6edf3;
            --border: #30363d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .header h1 {
            font-size: 24px;
        }

        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .premium-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }

        .free-badge {
            display: inline-block;
            background: var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }

        .error-msg {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .success-msg {
            background: #00aa00;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <h1>👤 Профиль</h1>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <div class="profile-card">
        <h2>Статистика продавца</h2>
        <div class="profile-stats">
            <div class="stat-item">
                <div class="stat-value" id="activeProducts">0</div>
                <div class="stat-label">Активных товаров</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalSales">0</div>
                <div class="stat-label">Продаж</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="sellerRating">—</div>
                <div class="stat-label">Рейтинг</div>
            </div>
        </div>
    </div>

    <div class="profile-card">
        <h2>
            Настройки профиля
            <span id="statusBadge"></span>
        </h2>
        
        <form id="profileForm">
            <div class="form-group">
                <label class="form-label">Никнейм продавца *</label>
                <input type="text" id="nickname" class="form-input" placeholder="Ваш уникальный никнейм" maxlength="30" required>
                <div class="char-counter"><span id="nicknameCounter">0</span>/30</div>
            </div>

            <div class="form-group">
                <label class="form-label">Описание профиля</label>
                <textarea id="bio" class="form-input" placeholder="Расскажите о себе как о продавце..." maxlength="500"></textarea>
                <div class="char-counter"><span id="bioCounter">0</span>/500</div>
            </div>

            <button type="submit" class="save-btn" id="saveBtn">Сохранить</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => goBack());

        const userId = tg.initDataUnsafe?.user?.id || 123456;
        const API_URL = window.location.origin;

        function goBack() {
            window.location.href = '/';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Счетчики символов
        document.getElementById('nickname').addEventListener('input', (e) => {
            document.getElementById('nicknameCounter').textContent = e.target.value.length;
        });

        document.getElementById('bio').addEventListener('input', (e) => {
            document.getElementById('bioCounter').textContent = e.target.value.length;
        });

        // Загрузка профиля
        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile?userId=${userId}`);
                const data = await response.json();

                if (response.ok && data.user) {
                    const user = data.user;
                    
                    document.getElementById('activeProducts').textContent = user.active_products_count;
                    document.getElementById('totalSales').textContent = user.total_sales;
                    document.getElementById('sellerRating').textContent = user.seller_rating || '—';
                    
                    if (user.nickname) {
                        document.getElementById('nickname').value = user.nickname;
                        document.getElementById('nicknameCounter').textContent = user.nickname.length;
                    }
                    
                    if (user.bio) {
                        document.getElementById('bio').value = user.bio;
                        document.getElementById('bioCounter').textContent = user.bio.length;
                    }

                    const badge = user.is_premium 
                        ? '<span class="premium-badge">⭐ Premium</span>'
                        : '<span class="free-badge">🆓 Free (до 10 товаров)</span>';
                    document.getElementById('statusBadge').innerHTML = badge;
                }
            } catch (e) {
                console.error('Load profile error:', e);
                showError('Ошибка загрузки профиля');
            }
        }

        // Сохранение профиля
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value.trim();
            const bio = document.getElementById('bio').value.trim();

            if (!nickname) {
                showError('Введите никнейм');
                return;
            }

            if (nickname.length < 3) {
                showError('Никнейм должен быть минимум 3 символа');
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';

            try {
                const response = await fetch(`${API_URL}/api/profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, nickname, bio })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('✅ Профиль сохранен!');
                    setTimeout(() => goBack(), 1500);
                } else {
                    showError(data.error === 'Nickname already taken' 
                        ? 'Этот никнейм уже занят' 
                        : 'Ошибка сохранения');
                }
            } catch (e) {
                console.error('Save error:', e);
                showError('Ошибка сохранения');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
            }
        });

        loadProfile();
    </script>
</body>
</html>
